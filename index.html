<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>大海航行靠舵手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      color: #ececec;
      line-height: 1.5;
      position: relative;
      /* 深色底色，在背景图加载前或透明后显示 */
      background-color: #1a0a0a;
    }

    /* 背景图层：固定在所有内容后面，25%透明度 */
    .background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0; /* 放在最底层 */
      overflow: hidden;
    }

    .background-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保持横图覆盖，裁剪多余部分 */
      display: block;
      opacity: 0.25; /* 25% 透明度 */
      filter: brightness(0.9); /* 轻微压暗，使红色主题更融合 */
    }

    /* 所有主要内容需要高于背景层 */
    .edge-quote, .card {
      position: relative;
      z-index: 2;
    }

    .card {
      max-width: 720px;
      width: 100%;
      background: #0d0d0d; /* 保留不透明底色，保证文字清晰 */
      border: 2px solid #b81c1c;
      box-shadow: 15px 15px 0 rgba(180, 30, 30, 0.25);
      padding: 2.2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      transition: all 0.2s;
      /* 确保卡片在背景上方 */
      z-index: 3;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: -0.5rem;
    }

    .logo-image {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border: 2px solid #b81c1c;
      background: #0a0303;
      display: block;
    }

    .header-section {
      border-bottom: 2px solid #9e1e1e;
      padding-bottom: 1.2rem;
    }

    .main-title {
      font-size: 2.8rem;
      font-weight: 700;
      color: #d92d2d;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      text-shadow: 2px 2px 0 #3f0f0f;
      word-break: break-word;
    }

    .sub-info {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.8rem 1.8rem;
      margin-top: 0.75rem;
      font-weight: 500;
    }

    .ip-location {
      background: #2f0f0f;
      color: #f5c6c6;
      padding: 0.2rem 0.9rem;
      font-size: 1rem;
      border: 1px solid #b33;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .poem-line {
      font-size: 1.2rem;
      color: #cf7b7b;
      font-style: italic;
      font-weight: 450;
      border-left: 4px solid #c0392b;
      padding-left: 1rem;
      margin-top: 0.3rem;
    }

    .tabs-container {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .tab-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 2px solid #a82323;
      width: fit-content;
      background: #1f0f0f;
    }

    .tab-btn {
      background: #1f0f0f;
      border: none;
      border-right: 2px solid #a82323;
      color: #d4a0a0;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.7rem 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      letter-spacing: 1px;
      background: #180808;
      text-transform: uppercase;
      font-family: inherit;
      outline: none;
      border-radius: 0;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn:hover {
      background: #3a1515;
      color: #ffb3b3;
    }

    .tab-btn.active {
      background: #b22222;
      color: white;
      border-right-color: #b22222;
      box-shadow: inset 0 0 0 1px #4a0404;
      font-weight: 700;
    }

    .tab-panel {
      background: #0f0404;
      border: 2px solid #b81c1c;
      padding: 1.5rem 1.5rem;
      font-size: 1.1rem;
      color: #f0d0d0;
      min-height: 150px;
      display: flex;
      align-items: flex-start;
      word-break: break-word;
      line-height: 1.6;
      transition: opacity 0.15s ease;
    }

    .tab-panel p {
      margin: 0;
      font-weight: 430;
    }

    .hidden-panel {
      display: none;
    }

    .active-panel {
      display: block;
    }

    .edge-quote {
      position: fixed;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 1.3rem;
      font-weight: 700;
      color: #b33b3b;
      letter-spacing: 3px;
      background: rgba(10, 0, 0, 0.75);
      padding: 1.2rem 0.5rem;
      border: 2px solid #a82323;
      background: #0e0303;
      text-shadow: 1px 1px 0 #1a0000;
      z-index: 5;
      white-space: nowrap;
      user-select: none;
    }

    .left-edge {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      border-right: none;
    }

    .right-edge {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border-left: none;
    }

    .action-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    .acknowledge-btn {
      background: transparent;
      border: 2px solid #c0392b;
      color: #e05a5a;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 0.75rem 2.8rem;
      background: #120505;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 0;
      box-shadow: 4px 4px 0 #4a1c1c;
      font-family: inherit;
    }

    .acknowledge-btn:hover {
      background: #b22222;
      color: #ffffff;
      border-color: #d93b3b;
      box-shadow: 4px 4px 0 #1e0404;
    }

    .acknowledge-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #4a1c1c;
    }

    @media (max-width: 650px) {
      .card {
        padding: 1.5rem 1.2rem;
      }
      .main-title {
        font-size: 2.2rem;
      }
      .logo-image {
        width: 80px;
        height: 80px;
      }
      .edge-quote {
        font-size: 1rem;
        padding: 0.5rem 0.2rem;
        letter-spacing: 1px;
      }
      .left-edge {
        left: 5px;
      }
      .right-edge {
        right: 5px;
      }
      .tab-btn {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .edge-quote {
        display: none;
      }
      body {
        padding: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- 背景图片层：横图，25%透明度，置于所有UI后面 -->
  <div class="background-layer">
    <img src="背景.avif" alt="背景图">
  </div>

  <div class="edge-quote left-edge">自信人生二百年</div>
  <div class="edge-quote right-edge">会当击水三千里</div>

  <main class="card">
    <div class="logo-container">
      <img src="头像.jpg" alt="左轮标志" class="logo-image">
    </div>

    <div class="header-section">
      <h1 class="main-title">你好，我叫左轮。</h1>
      <div class="sub-info">
        <span class="ip-location">IP：江苏</span>
        <span class="poem-line">"大雪压青松，青松挺且直"</span>
      </div>
    </div>

    <div class="tabs-container">
      <div class="tab-buttons">
        <button class="tab-btn active" id="tabBtn1">精神内容</button>
        <button class="tab-btn" id="tabBtn2">实践过程</button>
        <button class="tab-btn" id="tabBtn3">实践心得</button>
        <button class="tab-btn" id="tabBtn4">免责声明</button>
      </div>

      <div class="tab-panel active-panel" id="panel1">
        <p>做有道德，讲文明，遵法律，有认知的新时代新青年。敢于承担责任，争当时代先锋。本人爱好较多，"广交朋友"。</p>
      </div>
      <div class="tab-panel hidden-panel" id="panel2">
        <p>关注左轮（Revoler_M1835）谢谢喵</p>
      </div>
      <div class="tab-panel hidden-panel" id="panel3">
        <p>别视奸我了 我害怕了 我投降了</p>
      </div>
      <div class="tab-panel hidden-panel" id="panel4">
        <p>本网站仅用于个人学习、测试和展示前端。一切内容若有侵权、与我联系，立刻删除。</p>
      </div>
    </div>

    <div class="action-area">
      <button class="acknowledge-btn" id="receiveBtn">收到</button>
    </div>
  </main>

  <script>
    (function() {
      const btn1 = document.getElementById('tabBtn1');
      const btn2 = document.getElementById('tabBtn2');
      const btn3 = document.getElementById('tabBtn3');
      const btn4 = document.getElementById('tabBtn4');
      
      const panel1 = document.getElementById('panel1');
      const panel2 = document.getElementById('panel2');
      const panel3 = document.getElementById('panel3');
      const panel4 = document.getElementById('panel4');

      // 获取所有按钮和面板，便于统一管理
      const allBtns = [btn1, btn2, btn3, btn4];
      const allPanels = [panel1, panel2, panel3, panel4];

      function deactivateAll() {
        allBtns.forEach(btn => btn.classList.remove('active'));
        allPanels.forEach(panel => {
          panel.classList.add('hidden-panel');
          panel.classList.remove('active-panel');
        });
      }

      function activateTab(btn, panel) {
        deactivateAll();
        btn.classList.add('active');
        panel.classList.remove('hidden-panel');
        panel.classList.add('active-panel');
      }

      btn1.addEventListener('click', () => activateTab(btn1, panel1));
      btn2.addEventListener('click', () => activateTab(btn2, panel2));
      btn3.addEventListener('click', () => activateTab(btn3, panel3));
      btn4.addEventListener('click', () => activateTab(btn4, panel4));

      // 确保初始状态正确
      if (!btn1.classList.contains('active')) {
        deactivateAll();
        btn1.classList.add('active');
        panel1.classList.remove('hidden-panel');
        panel1.classList.add('active-panel');
      }

      const receiveBtn = document.getElementById('receiveBtn');
      receiveBtn.addEventListener('click', () => {
        receiveBtn.textContent = '已收到';
        receiveBtn.style.backgroundColor = '#b22222';
        receiveBtn.style.color = 'white';
        receiveBtn.style.borderColor = '#e05a5a';
        
        setTimeout(() => {
          receiveBtn.textContent = '收到';
          receiveBtn.style.backgroundColor = '';
          receiveBtn.style.color = '';
          receiveBtn.style.borderColor = '';
        }, 1500);
        
        alert('✓ 自信人生二百年，会当击水三千里。');
      });
    })();
  </script>
</body>
</html>
