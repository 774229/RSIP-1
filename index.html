<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>左轮 · 红色主题</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a0a0a; /* 深红黑底 */
      font-family: 'Segoe UI', 'Noto Serif SC', 'Times New Roman', '宋体', '仿宋', '华文楷体', '楷体', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 边缘低调的装饰文字 —— 左右两侧竖排诗句 */
    .edge-poem {
      position: fixed;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 4px;
      color: #b33a3a;
      opacity: 0.5;
      font-family: 'Noto Serif SC', '楷体', 'KaiTi', '华文楷体', serif;
      z-index: 0;
      user-select: none;
      pointer-events: none; /* 让点击穿透到按钮等 */
      transition: opacity 0.3s ease;
    }

    .left-poem {
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
    }

    .right-poem {
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
    }

    @media (max-width: 640px) {
      .edge-poem {
        font-size: 0.9rem;
        letter-spacing: 2px;
      }
      .left-poem {
        left: 0.6rem;
      }
      .right-poem {
        right: 0.6rem;
      }
    }

    /* 主卡片容器 */
    .card {
      position: relative;
      z-index: 10;
      max-width: 720px;
      width: 100%;
      background: rgba(10, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: linear-gradient(145deg, #1f0c0c 0%, #2d0e0e 100%);
      border: 1px solid rgba(200, 50, 50, 0.35);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(180, 40, 40, 0.2) inset;
      border-radius: 2.5rem;
      padding: 2.8rem 2.2rem;
      color: #f0d9d9;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      transition: all 0.2s;
    }

    /* 头部区域 */
    .header {
      text-align: center;
      border-bottom: 1px dashed #b54a4a;
      padding-bottom: 1.2rem;
    }

    .main-title {
      font-size: 3.2rem;
      font-weight: 700;
      color: #e63946;
      text-shadow: 0 0 12px #b22222, 0 4px 8px rgba(0,0,0,0.7);
      letter-spacing: 6px;
      font-family: 'Noto Serif SC', '华文楷体', '楷体', '宋体', serif;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .sub-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.8rem 2.2rem;
      font-size: 1.25rem;
      color: #dba8a8;
      margin-top: 0.25rem;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .sub-tags span {
      background: rgba(180, 40, 40, 0.15);
      padding: 0.3rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid #a53f3f;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    .ip-tag {
      font-style: italic;
      color: #f4bc7c;
    }

    .motto-tag {
      font-family: '楷体', 'KaiTi', '华文楷体', serif;
      color: #f0c0b0;
    }

    /* 选项卡容器 */
    .tabs-container {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .tab-item {
      background: rgba(30, 10, 10, 0.7);
      border: 1px solid #9e3a3a;
      border-radius: 2rem;
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .tab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.8rem;
      cursor: pointer;
      background: rgba(120, 20, 20, 0.25);
      transition: background 0.2s;
      font-weight: 500;
      letter-spacing: 2px;
      color: #f3cfcf;
      border-bottom: 1px solid transparent;
    }

    .tab-header:hover {
      background: rgba(180, 45, 45, 0.35);
    }

    .tab-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f5d0d0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-title::before {
      content: "♦";
      color: #e63946;
      font-size: 1.1rem;
      margin-right: 0.4rem;
      opacity: 0.8;
    }

    .tab-arrow {
      font-size: 1.4rem;
      transition: transform 0.3s ease;
      color: #c25454;
    }

    .tab-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.33, 1, 0.68, 1), padding 0.3s;
      background: rgba(20, 5, 5, 0.65);
      color: #e6c8c8;
      font-size: 1.05rem;
      line-height: 1.7;
      letter-spacing: 0.8px;
      border-top: 1px solid #7a2e2e;
      padding: 0 1.8rem;
    }

    .tab-item.open .tab-content {
      max-height: 200px; /* 足够容纳内容 */
      padding: 1.2rem 1.8rem;
    }

    .tab-item.open .tab-arrow {
      transform: rotate(180deg);
      color: #e63946;
    }

    .tab-item.open .tab-header {
      background: rgba(170, 35, 35, 0.35);
      border-bottom: 1px solid #b54545;
    }

    /* 内容内部样式 */
    .content-text {
      font-family: 'Noto Serif SC', '楷体', '华文楷体', '宋体', serif;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 底部区域：诗句 + 按钮 */
    .footer-area {
      margin-top: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      text-align: center;
    }

    .poem-line {
      font-size: 1.3rem;
      font-weight: 350;
      color: #c97b7b;
      letter-spacing: 4px;
      font-family: '华文楷体', '楷体', 'KaiTi', 'Noto Serif SC', serif;
      background: rgba(150, 30, 30, 0.2);
      padding: 0.5rem 2rem;
      border-radius: 3rem;
      border: 1px dashed #aa4a4a;
      backdrop-filter: blur(4px);
      width: fit-content;
      margin: 0 auto;
      text-shadow: 1px 1px 2px black;
    }

    .receive-btn {
      background: #9e2a2a;
      border: none;
      color: #fbe4e4;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 0.9rem 2.8rem;
      border-radius: 3rem;
      letter-spacing: 6px;
      cursor: pointer;
      background: linear-gradient(135deg, #b22222, #7a1f1f);
      box-shadow: 0 10px 18px rgba(200, 30, 30, 0.5), 0 0 12px #b33a3a;
      border: 1px solid #d45d5d;
      transition: all 0.25s ease;
      font-family: 'Noto Serif SC', '楷体', '宋体', serif;
      backdrop-filter: blur(5px);
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .receive-btn:hover {
      background: linear-gradient(135deg, #c53232, #8b1a1a);
      box-shadow: 0 0 24px #e63946, 0 10px 20px rgba(180, 0, 0, 0.8);
      transform: scale(1.03);
      color: white;
      border-color: #f07c7c;
    }

    .receive-btn:active {
      transform: scale(0.97);
    }

    /* 响应式调整 */
    @media (max-width: 500px) {
      .card {
        padding: 2rem 1.2rem;
      }
      .main-title {
        font-size: 2.4rem;
        letter-spacing: 3px;
      }
      .sub-tags {
        flex-direction: column;
        gap: 0.7rem;
      }
      .tab-header {
        padding: 0.9rem 1.2rem;
      }
      .tab-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <!-- 左侧竖排诗句边缘 -->
  <div class="edge-poem left-poem">自信人生二百年</div>
  <!-- 右侧竖排诗句边缘 -->
  <div class="edge-poem right-poem">会当击水三千里</div>

  <!-- 主体卡片 -->
  <main class="card">
    <!-- 头部：大标题 + 小标语 -->
    <div class="header">
      <h1 class="main-title">你好，我叫左轮</h1>
      <div class="sub-tags">
        <span class="ip-tag">IP：江苏苏州</span>
        <span class="motto-tag">“大雪压青松，轻松挺且直”</span>
      </div>
    </div>

    <!-- 三个可展开选项卡 -->
    <div class="tabs-container">
      <!-- 选项卡1：精神内容（意志内容） -->
      <div class="tab-item" id="tab1">
        <div class="tab-header" data-tab="tab1">
          <span class="tab-title">精神内容</span>
          <span class="tab-arrow">▼</span>
        </div>
        <div class="tab-content">
          <div class="content-text">做有道德，讲文明，遵法律，有认知的新时代新青年。本人爱好较多，“广交朋友”。</div>
        </div>
      </div>

      <!-- 选项卡2：实践过程 -->
      <div class="tab-item" id="tab2">
        <div class="tab-header" data-tab="tab2">
          <span class="tab-title">实践过程</span>
          <span class="tab-arrow">▼</span>
        </div>
        <div class="tab-content">
          <div class="content-text">关注左轮谢谢喵</div>
        </div>
      </div>

      <!-- 选项卡3：实践心得 -->
      <div class="tab-item" id="tab3">
        <div class="tab-header" data-tab="tab3">
          <span class="tab-title">实践心得</span>
          <span class="tab-arrow">▼</span>
        </div>
        <div class="tab-content">
          <div class="content-text">别视奸我了我害怕了我投降了</div>
        </div>
      </div>
    </div>

    <!-- 底部区域：诗句 + 按钮 -->
    <div class="footer-area">
      <div class="poem-line">自信人生二百年，会当击水三千里</div>
      <button class="receive-btn" id="receiveButton">收到</button>
    </div>
  </main>

  <script>
    (function() {
      // 获取所有选项卡头部
      const tabHeaders = document.querySelectorAll('.tab-header');
      
      // 为每个头部绑定点击事件
      tabHeaders.forEach(header => {
        header.addEventListener('click', function(e) {
          // 获取当前选项卡的父级 .tab-item
          const tabItem = this.closest('.tab-item');
          if (!tabItem) return;
          
          // 切换 open 类：如果已经打开则关闭，否则打开（同时关闭其他选项卡）
          const isCurrentlyOpen = tabItem.classList.contains('open');
          
          // 先关闭所有选项卡（移除open类）
          const allTabItems = document.querySelectorAll('.tab-item');
          allTabItems.forEach(item => item.classList.remove('open'));
          
          // 如果之前不是打开状态，则打开当前点击的选项卡
          if (!isCurrentlyOpen) {
            tabItem.classList.add('open');
          }
          // 如果之前是打开状态，则上面已移除，实现关闭效果（折叠）
        });
      });

      // 按钮交互：“收到” 点击后简单反馈
      const receiveBtn = document.getElementById('receiveButton');
      if (receiveBtn) {
        receiveBtn.addEventListener('click', function() {
          // 优雅反馈：按钮短暂变化并提示（可改为alert或控制台，这里使用按钮文字短暂变化）
          const originalText = this.textContent;
          this.textContent = '✓ 已收到';
          this.style.backgroundColor = '#b54545';
          this.style.transition = '0.2s';
          
          // 也可以添加一个微小的动画或者恢复文字
          setTimeout(() => {
            this.textContent = originalText;
            this.style.backgroundColor = '';
          }, 1500);
          
          // 同时也可以显示一个温柔提示（不干扰视觉）
          console.log('左轮：收到！感谢你的关注。');
          // 如果需要更明显的反馈，可以创建一个小提示，但保持简约，这里不做弹窗。
        });
      }

      // 可选：默认打开第一个选项卡？ 根据要求未明确需要默认展开，因此保持全部折叠状态，更显简洁。
      // 用户可自行点击展开。
    })();
  </script>
</body>
</html>
